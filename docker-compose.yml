services:
  postgres:
    image: postgres:15-alpine
    container_name: latex_editor_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: latex_editor
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  # Local S3-compatible Object Storage Bucket (RustFS)
  # This fully mimics Railway Storage Buckets locally with Apache 2.0 license and Rust performance!
  rustfs:
    image: rustfs/rustfs:latest
    container_name: latex_editor_rustfs
    ports:
      - "9000:9000" # S3 API port
      - "9001:9001" # Web Console/Dashboard
    environment:
      - RUSTFS_ACCESS_KEY=minioadmin
      - RUSTFS_SECRET_KEY=minioadmin
      - RUSTFS_CONSOLE_ENABLE=true
    volumes:
      - rustfs_data:/data
    command: /data

  # Automatically creates required S3 buckets on startup
  createbuckets:
    image: amazon/aws-cli:latest
    container_name: latex_editor_createbuckets
    depends_on:
      - rustfs
    environment:
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_DEFAULT_REGION=us-east-1
    entrypoint: >
      /bin/sh -c "
        until aws --endpoint-url http://rustfs:9000 s3 ls; do
          echo 'Waiting for RustFS...'; sleep 2;
        done;
        aws --endpoint-url http://rustfs:9000 s3 mb s3://latex-editor --region us-east-1 || true;
        echo 'Bucket ready.';
      "


  compiler:
    # Tectonic publishes no aarch64-linux-gnu build, and only the gnu build has
    # working ICU (see apps/compiler/Dockerfile). Pinning to amd64 keeps Apple
    # Silicon dev identical to production (Railway is amd64) instead of silently
    # losing Thai/Lao/Khmer/CJK line breaking locally; the cost is emulation here.
    platform: linux/amd64
    build:
      context: ./apps/compiler
      dockerfile: Dockerfile
    container_name: latex_editor_compiler
    ports:
      - "3001:3001"
    environment:
      - PORT=3001
      - REDIS_URL=redis://redis:6379

  collaboration:
    build:
      context: .
      dockerfile: apps/collaboration/Dockerfile
    container_name: latex_editor_collaboration
    ports:
      - "1234:1234"
    # Picks up CLERK_SECRET_KEY (and CLERK_AUTHORIZED_PARTIES, if set) from the
    # editor's env file — the root .env.local only holds VERCEL_OIDC_TOKEN, so
    # pointing here is what actually gives this service a Clerk key locally.
    # Auth now fails closed without one (server.ts requires ALLOW_COLLAB_GUEST=true
    # to run without CLERK_SECRET_KEY) instead of silently accepting everyone.
    # Same file also supplies COLLAB_INTERNAL_SECRET, the shared secret this
    # service checks on POST /apply (the editor's out-of-band write notify —
    # see apps/editor/lib/collab-notify.ts) — must match on both sides.
    env_file:
      - apps/editor/.env.local
    environment:
      - PORT=1234
      - REDIS_URL=redis://redis:6379
      # Service-name DNS (not localhost) — this runs inside the compose network,
      # unlike the editor process which hits these same backends from the host.
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:password@postgres:5432/latex_editor}
      - STORAGE_PROVIDER=s3
      - AWS_ENDPOINT=http://rustfs:9000
      - AWS_ACCESS_KEY_ID=minioadmin
      - AWS_SECRET_ACCESS_KEY=minioadmin
      - AWS_BUCKET_NAME=latex-editor
      - AWS_REGION=us-east-1
      - S3_FORCE_PATH_STYLE=true
    depends_on:
      redis:
        condition: service_healthy
      postgres:
        condition: service_started
      createbuckets:
        condition: service_completed_successfully

  redis:
    image: redis:7-alpine
    container_name: latex_editor_redis
    command: redis-server --maxmemory 256mb --maxmemory-policy volatile-lru
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    volumes:
      - redis_data:/data

volumes:
  postgres_data:
  rustfs_data:
  redis_data:

