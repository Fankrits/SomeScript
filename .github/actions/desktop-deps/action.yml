name: Desktop build dependencies
description: The OS packages Tauri builds against on Linux, and a check that Windows has the C compiler the SyncTeX build needs.

runs:
  using: composite
  steps:
    # The webview, GTK and friends: https://v2.tauri.app/start/prerequisites/#linux
    # xvfb: the smoke test needs a display even though the app shows no window when headless.
    # libfuse2t64: the AppImage tooling (linuxdeploy and its plugins are AppImages themselves).
    - if: runner.os == 'Linux'
      shell: bash
      run: |
        sudo apt-get update
        sudo apt-get install -y --no-install-recommends \
          libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libxdo-dev libssl-dev \
          libayatana-appindicator3-dev patchelf file xdg-utils libfuse2t64 xvfb

    # build-synctex.sh compiles SyncTeX (and a vendored zlib) with gcc; the runner image ships one.
    - if: runner.os == 'Windows'
      shell: bash
      run: gcc --version | head -n 1
