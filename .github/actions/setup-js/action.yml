name: Set up JS
description: Bun (the version is pinned here, in one place), a cache of Bun's package cache, and a frozen-lockfile install.

inputs:
  install:
    description: Run `bun install --frozen-lockfile` (set to "false" for jobs that only need the bun binary).
    default: "true"

runs:
  using: composite
  steps:
    # Keep in sync with "packageManager" in the root package.json.
    - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      with:
        bun-version: 1.3.14

    - if: inputs.install == 'true'
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ~/.bun/install/cache
        key: bun-${{ runner.os }}-${{ hashFiles('bun.lock') }}
        restore-keys: |
          bun-${{ runner.os }}-

    - if: inputs.install == 'true'
      shell: bash
      run: bun install --frozen-lockfile
