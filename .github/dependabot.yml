version: 2

# Updates are grouped so a week's worth arrives as one PR per ecosystem, and anything released in
# the last 7 days waits (cooldown): a freshly published malicious version is usually pulled quickly.
# Major versions are left to people.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
      # Moved by hand, together: apps/tauri must pin the exact React the editor uses, or the
      # desktop host ends up with two copies. The CodeMirror packages are pinned by root overrides.
      - dependency-name: react
      - dependency-name: react-dom
      - dependency-name: "@types/react"
      - dependency-name: "@types/react-dom"
      - dependency-name: "@codemirror/*"
      - dependency-name: shiki
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: cargo
    directory: /apps/tauri/src-tauri
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    cooldown:
      default-days: 7
    groups:
      tauri:
        patterns: ["tauri", "tauri-*"]
      minor-and-patch:
        update-types: [minor, patch]
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"

  - package-ecosystem: docker
    directories:
      - /apps/compiler
      - /apps/collaboration
    schedule:
      interval: monthly
    commit-message:
      prefix: "chore(deps)"
