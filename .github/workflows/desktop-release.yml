name: Desktop release

# Tag `desktop-vX.Y.Z` (on a commit that is on main) to publish a DRAFT GitHub release. A person
# reviews the draft and publishes it. Running it by hand (workflow_dispatch) builds everything
# but publishes nothing.
#
# Unsigned until these repository secrets exist: APPLE_CERTIFICATE (base64 .p12),
# APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD (app-specific),
# APPLE_TEAM_ID. See docs/ci-cd.md.

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: Verify the tag
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the tag's commit must be provably on main
          persist-credentials: false
      - uses: ./.github/actions/setup-js
        with:
          install: "false"
      - name: Tag matches Cargo.toml, tauri.conf.json and package.json
        if: github.ref_type == 'tag'
        env:
          TAG: ${{ github.ref_name }}
        run: bun apps/tauri/scripts/check-version.mjs "$TAG"
      - name: Tagged commit is on main
        if: github.ref_type == 'tag'
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::$GITHUB_REF_NAME points at a commit that is not on main. Release only reviewed code: merge first, then tag."
            exit 1
          fi
      - name: Read the version
        id: version
        run: echo "version=$(jq -r .version apps/tauri/src-tauri/tauri.conf.json)" >> "$GITHUB_OUTPUT"

  bundle:
    name: Build, verify and smoke-test
    needs: verify
    uses: ./.github/workflows/desktop-bundle.yml
    with:
      release: true
    permissions:
      contents: read
    secrets:
      APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
      APPLE_ID: ${{ secrets.APPLE_ID }}
      APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

  publish:
    name: Draft the GitHub release
    needs: [verify, bundle]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write # create the release
      id-token: write # sign the build provenance
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: desktop-macos-arm64
          path: dist
      - name: Attest build provenance
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: dist/*
      - name: Create the draft release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.verify.outputs.version }}
          SIGNED: ${{ needs.bundle.outputs.signed }}
          REPO: ${{ github.repository }}
        run: |
          if [ "$SIGNED" = "true" ]; then
            trust="Signed with a Developer ID certificate and notarized by Apple."
          else
            trust="**Not signed or notarized.** macOS will warn that the app is from an unidentified developer: open it with right-click, then Open, once."
          fi
          cat > notes.md <<NOTES
          SomeScript Desktop ${VERSION} for macOS (Apple Silicon). A free, local LaTeX editor: your projects are plain folders and compiling uses a bundled Tectonic.

          ${trust}

          Verify a download with \`shasum -a 256 -c SHA256SUMS.txt\`, or check its build provenance with \`gh attestation verify <file> --repo ${REPO}\`.

          ---
          NOTES
          flags=(--draft --verify-tag --title "SomeScript Desktop ${VERSION}" --generate-notes --notes-file notes.md)
          case "$VERSION" in *-*) flags+=(--prerelease) ;; esac
          if gh release view "$TAG" --repo "$REPO" > /dev/null 2>&1; then
            gh release upload "$TAG" dist/* --clobber --repo "$REPO"
          else
            gh release create "$TAG" dist/* "${flags[@]}" --repo "$REPO"
          fi
