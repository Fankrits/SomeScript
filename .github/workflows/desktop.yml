name: Desktop

# The desktop app (apps/tauri) reuses apps/editor's UI source through Vite aliases, so editor
# changes can break it: this runs on editor changes too, not just apps/tauri.
on:
  pull_request:
    paths:
      - "apps/tauri/**"
      - "apps/editor/**"
      - "apps/compiler/scripts/build-synctex.sh"
      - "bun.lock"
      - ".github/workflows/desktop.yml"
  push:
    branches: [main]
    tags: ["desktop-v*"]
  workflow_dispatch:

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/tauri/src-tauri
      - run: bun install --frozen-lockfile
      - name: Type-check (desktop host + the editor source it aliases)
        run: cd apps/tauri && bun run typecheck
      - name: Lint and format
        run: cd apps/tauri && bun run lint && bun run format:check
      # tauri::generate_context! embeds the built frontend, so it must exist before cargo runs.
      - name: Build frontend
        run: cd apps/tauri && bun run web:build
      # Fails, naming the path, when the editor starts calling an /api route the Rust server lacks.
      - name: Drift guard (editor /api calls vs Rust routes)
        run: cd apps/tauri && bun test
      - name: Rust format and lint
        run: |
          cd apps/tauri/src-tauri
          cargo fmt --check
          cargo clippy --all-targets -- -D warnings
      - name: Rust tests
        run: cd apps/tauri/src-tauri && cargo test
      - name: Fetch sidecars
        run: cd apps/tauri && bun run desktop:sidecars
      # Real Tectonic + SyncTeX. Needs the network to fetch TeX packages, so it must not gate merges.
      - name: Real Tectonic round trip
        continue-on-error: true
        run: |
          cd apps/tauri/src-tauri
          TECTONIC_BIN="$PWD/binaries/tectonic-aarch64-apple-darwin" \
          SYNCTEX_BIN="$PWD/binaries/synctex-aarch64-apple-darwin" \
          cargo test -- --ignored real_

  # Unsigned build, uploaded as a workflow artifact. Signing and notarization need Apple
  # Developer ID secrets (APPLE_CERTIFICATE, APPLE_SIGNING_IDENTITY, APPLE_ID, APPLE_PASSWORD,
  # APPLE_TEAM_ID); add them and Tauri signs the app and its sidecars automatically.
  bundle:
    if: startsWith(github.ref, 'refs/tags/desktop-v') || github.event_name == 'workflow_dispatch'
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/tauri/src-tauri
      - run: bun install --frozen-lockfile
      - run: cd apps/tauri && bun run desktop:sidecars
      - run: cd apps/tauri && bun run desktop:build
      - uses: actions/upload-artifact@v4
        with:
          name: somescript-desktop-macos-arm64
          path: |
            apps/tauri/src-tauri/target/release/bundle/dmg/*.dmg
            apps/tauri/src-tauri/target/release/bundle/macos/*.app
          if-no-files-found: error
