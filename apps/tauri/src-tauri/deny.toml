# cargo-deny policy for the desktop app's Rust dependencies.
#   cargo deny check                 (CI runs this in .github/workflows/security.yml)
#
# Only the platforms we ship are analysed (keep in step with the matrix in desktop-bundle.yml).

[graph]
targets = [
  "aarch64-apple-darwin",
  "x86_64-apple-darwin",
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-gnu",
]

[advisories]
version = 2
yanked = "deny"
# Add an entry only with a reason and a date to revisit.
ignore = [
  { id = "RUSTSEC-2024-0370", reason = "proc-macro-error is a build-time dependency of gtk3-macros (the Linux GTK3 bindings under tauri/wry): unmaintained, not a vulnerability, and not in the shipped binary. Nothing to upgrade until tauri leaves gtk3-rs (revisit 2027-01)" },
]

[licenses]
version = 2
confidence-threshold = 0.9
# Permissive licenses only. A copyleft dependency in a bundled app is a decision for a human,
# so it must fail here and be added on purpose. (Allow-list generated from the real tree.)
allow = [
  "0BSD",
  "Apache-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "BSD-3-Clause",
  "BSL-1.0",
  "CC0-1.0",
  "MIT",
  "MIT-0",
  "MPL-2.0",
  "Unicode-3.0",
  "Unlicense",
  "Zlib",
]

[licenses.private]
# Our own crate is `publish = false` and has no license field (the app's license is undecided).
ignore = true

[bans]
multiple-versions = "warn"
wildcards = "deny"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
