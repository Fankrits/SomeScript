[package]
name = "somescript-desktop"
version = "0.1.1"
description = "SomeScript desktop: free, local LaTeX editor"
authors = ["Fankrits"]
publish = false
edition = "2024"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "somescript_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
axum = { version = "0.8.9", features = ["multipart"] }
tokio = { version = "1.53.2", features = [
  "rt-multi-thread",
  "net",
  "macros",
  "process",
  "io-util",
  "sync",
  "time",
  "fs",
] }
getrandom = "0.4.3"
tauri-plugin-dialog = "2.8.2"
tempfile = "3.27.0"
# canonicalize() without Windows' \\?\ prefix, which Tectonic and the UI would otherwise see.
dunce = "1.0.5"
sha2 = "0.11.1"
regex = "1.13.1"
percent-encoding = "2.3.2"
tokio-stream = "0.1.19"
zip = { version = "9.0.2", default-features = false, features = ["deflate"] }
# HTTP client for the AI chat (bring-your-own-key providers, custom endpoints). rustls with `ring`
# rather than reqwest's default aws-lc-rs: pure Rust + a small C core, no cmake/NASM on the Windows
# runner, and it links statically so the Linux bundle needs no libssl. System roots (and the OS
# proxy settings) are honoured, so corporate proxies and local CAs keep working.
reqwest = { version = "0.13.5", default-features = false, features = [
  "rustls-no-provider",
  "system-proxy",
  "stream",
  "json",
] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
globset = "0.4"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

# Proc-macros and build scripts run on the build machine. Stripping their dylibs makes them
# unloadable on current macOS ("mis-aligned LINKEDIT string pool"), so only the shipped binary
# is stripped.
[profile.release.build-override]
strip = "none"

[dev-dependencies]
http-body-util = "0.1.5"
tower = { version = "0.5.3", features = ["util"] }
